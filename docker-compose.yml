version: '3.8'

# =============================================================================
# 捷淞进销存系统 - Docker Compose 部署配置
# 使用方法：docker compose up -d
# =============================================================================

services:
  # =============================================================================
  # 数据库服务 (PostgreSQL)
  # =============================================================================
  db:
    image: postgres:15-alpine
    container_name: jiesong-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=jiesong
      - POSTGRES_USER=jiesong
      - POSTGRES_PASSWORD=jiesong_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - jiesong-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiesong -d jiesong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # 后端服务
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jiesong-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-key-in-production}
      - JWT_EXPIRES_IN=7d
      - DATABASE_URL=postgresql://jiesong:jiesong_pass@db:5432/jiesong?schema=public
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    networks:
      - jiesong-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # 前端服务
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 部署时请替换为实际 VPS IP 地址或域名
        - NEXT_PUBLIC_API_BASE_URL=http://YOUR_VPS_IP/api/v1
    container_name: jiesong-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jiesong-network

  # =============================================================================
  # Nginx 反向代理
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: jiesong-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - jiesong-network

networks:
  jiesong-network:
    driver: bridge

volumes:
  backend-data:
  backend-logs:
  nginx-logs:
  postgres-data:
