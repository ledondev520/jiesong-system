# G-Stack CI Workflow
# 主 CI 流程: 代码质量检查 + 单元测试

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # 代码质量检查
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit

  # 单元测试
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Prepare isolated frontend API fixture dependencies
        working-directory: ./backend
        run: |
          test ! -e .env
          test ! -L .env
          npm ci
          npm run db:generate

      - name: Run unit tests
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 7

      # 变更门禁同 test-and-acceptance.yml：仅整个 diff 为 UI-only 时才为 false，其余情况照常全测。
      - name: Change gate
        id: gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-ui-only.cjs backend-gate

      - name: Run backend tests
        if: steps.gate.outputs.backend_changed != 'false'
        env:
          DATABASE_URL: file:./dev.db
        run: |
          cd backend
          npx prisma migrate deploy
          npm run test

      - name: UI-only change - lifecycle contract only
        if: steps.gate.outputs.backend_changed == 'false'
        run: node scripts/check-lifecycle.cjs

  # 构建测试
  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
