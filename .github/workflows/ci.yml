# G-Stack CI Workflow
# 主 CI 流程: push 代码质量检查 + 构建测试
# PR 上的 Code Quality / Unit Tests 必过检查名由 pr-review.yml 与 test-and-acceptance.yml 提供（避免同一检查重复运行）。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 新 push 取消同一 PR 的旧运行；非 PR 事件用唯一 run_id，永不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # push 上的代码质量检查（PR 上由 pr-review.yml 的 Lint/Type 并行 job + "Code Quality" 汇总覆盖）
  quality:
    name: Code Quality (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit

  # 构建测试（不再依赖 quality / test，并行运行）
  build:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
