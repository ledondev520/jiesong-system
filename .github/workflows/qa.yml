# G-Stack QA Workflow
# 自动化 QA 测试 + 健康度检查

name: QA & Health Check

on:
  push:
    branches: [main]
  schedule:
    # 每天凌晨 2 点运行
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # QA 自动化测试
  qa-test:
    name: QA Automation Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright
        run: npm install -g playwright

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Start dev server
        working-directory: ./frontend
        run: npm run dev &
        env:
          PORT: 3000

      - name: Wait for server
        run: sleep 10

      - name: Run QA tests
        run: |
          if [ -f .gstack/qa-test-comprehensive.sh ]; then
            bash .gstack/qa-test-comprehensive.sh
          else
            echo "QA script not found, skipping"
          fi

      - name: Upload QA report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-report
          path: .gstack/qa-reports/
          retention-days: 30

  # 健康度检查
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: qa-test
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run health check
        run: |
          if [ -f .gstack/autoloop.sh ]; then
            bash .gstack/autoloop.sh health
          fi

      - name: Check security vulnerabilities
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Upload health report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: health-report
          path: .gstack/loop-reports/
          retention-days: 30
