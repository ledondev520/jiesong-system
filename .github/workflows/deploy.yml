# DRAFT: replace the existing deploy.yml ON A DEDICATED MAINTENANCE BRANCH ONLY.
# No main push/PR trigger; dispatch only after independent review and owner approval.
# Uses existing staging-scoped SSH credentials for the same host as current main deployment.
name: Nestlet Read-only Host Inventory
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inventory, no installs or service changes
        required: true
        default: inventory
        type: choice
        options:
          - inventory
      expected_host_sha256:
        description: SHA256 of the selected server IPv4 address; checked before SSH
        required: true
        type: string
      host_key_sha256:
        description: Optional independently verified VPS SSH public host-key fingerprint
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: nestlet-host-inventory
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/ops/nestlet-host-inventory-20261007' && github.actor == 'ledondev520'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Read-only host inventory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          EXPECTED_HOST_SHA256: ${{ inputs.expected_host_sha256 }}
          EXPECTED_HOST_FINGERPRINT: ${{ inputs.host_key_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          if [[ -n "$EXPECTED_HOST_FINGERPRINT" ]]; then
            [[ "$EXPECTED_HOST_FINGERPRINT" =~ ^SHA256:[a-zA-Z0-9+/]{43}$ ]]
          fi
          [[ "$RELEASE_OPERATION" == inventory ]]
          [[ "$EXPECTED_HOST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          matched=0
          while IFS= read -r address; do
            observed="$(printf '%s' "$address" | sha256sum | awk '{print $1}')"
            if [[ "$observed" == "$EXPECTED_HOST_SHA256" ]]; then matched=1; fi
          done < <(getent ahostsv4 "$SSH_HOST" | awk '{print $1}' | sort -u)
          [[ "$matched" == 1 ]] || { echo 'Selected server address does not match the existing SSH target'; exit 1; }
          echo 'Existing SSH target matches selected server address; no address is logged.'
          umask 077
          # No pin: inherit the already-authorized deploy channel's host-key discovery.
          # A supplied independent pin is mandatory to match; never bypass a mismatch.
          known_hosts="$(mktemp)"
          scanned="$(mktemp)"
          one="$(mktemp)"
          trap 'rm -f "$known_hosts" "$scanned" "$one"' EXIT
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > "$scanned" 2>/dev/null
          if [[ -n "$EXPECTED_HOST_FINGERPRINT" ]]; then
            while IFS= read -r host_key; do
              printf '%s\n' "$host_key" > "$one"
              observed="$(ssh-keygen -lf "$one" -E sha256 | awk '{print $2}')"
              if [[ "$observed" == "$EXPECTED_HOST_FINGERPRINT" ]]; then
                cat "$one" >> "$known_hosts"
              fi
            done < "$scanned"
          else
            cat "$scanned" > "$known_hosts"
            echo 'Host identity trust inherited from existing deploy channel; not independently verified.'
          fi
          test -s "$known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o UserKnownHostsFile="$known_hosts" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'sh -s' < scripts/nestlet-host-inventory.sh
