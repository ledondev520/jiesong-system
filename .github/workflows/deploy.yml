# DRAFT: replace the existing deploy.yml ON A DEDICATED MAINTENANCE BRANCH ONLY.
# No main push/PR trigger; dispatch only after independent review and owner approval.
# Uses existing staging-scoped SSH credentials for the same host as current main deployment.
name: Nestlet First SQLite Rollout
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Upgrade only Nestlet to a reviewed CI-green pinned release
        required: true
        default: upgrade
        type: choice
        options:
          - upgrade
      release_sha:
        description: Exact approved SQLite-enabled commit with passing Node and container CI
        required: true
        type: string
      expected_host_sha256:
        description: SHA256 of the selected server IPv4 address; checked before SSH
        required: true
        type: string
      host_key_sha256:
        description: Optional independently verified VPS SSH public host-key fingerprint
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: nestlet-stage
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'ledondev520/jiesong-system' && github.repository_owner == 'ledondev520' && github.ref == 'refs/heads/ops/nestlet-sqlite-20261007' && github.actor == 'ledondev520'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Upgrade pinned Nestlet release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_HOST_SHA256: ${{ inputs.expected_host_sha256 }}
          EXPECTED_HOST_FINGERPRINT: ${{ inputs.host_key_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          if [[ -n "$EXPECTED_HOST_FINGERPRINT" ]]; then
            [[ "$EXPECTED_HOST_FINGERPRINT" =~ ^SHA256:[a-zA-Z0-9+/]{43}$ ]]
          fi
          [[ "$RELEASE_OPERATION" == upgrade ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_HOST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          matched_address=
          while IFS= read -r address; do
            observed="$(printf '%s' "$address" | sha256sum | awk '{print $1}')"
            if [[ "$observed" == "$EXPECTED_HOST_SHA256" ]]; then matched_address="$address"; fi
          done < <(getent ahostsv4 "$SSH_HOST" | awk '{print $1}' | sort -u)
          [[ -n "$matched_address" ]] || { echo 'Selected server address does not match the existing SSH target'; exit 1; }
          echo 'Existing SSH target matches selected server address; no address is logged.'
          echo "::add-mask::$matched_address"
          umask 077
          # No pin: inherit the already-authorized deploy channel's host-key discovery.
          # A supplied independent pin is mandatory to match; never bypass a mismatch.
          known_hosts="$(mktemp)"
          scanned="$(mktemp)"
          one="$(mktemp)"
          trap 'rm -f "$known_hosts" "$scanned" "$one"' EXIT
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$matched_address" > "$scanned" 2>/dev/null
          if [[ -n "$EXPECTED_HOST_FINGERPRINT" ]]; then
            while IFS= read -r host_key; do
              printf '%s\n' "$host_key" > "$one"
              observed="$(ssh-keygen -lf "$one" -E sha256 | awk '{print $2}')"
              if [[ "$observed" == "$EXPECTED_HOST_FINGERPRINT" ]]; then
                cat "$one" >> "$known_hosts"
              fi
            done < "$scanned"
          else
            cat "$scanned" > "$known_hosts"
            echo 'Host identity trust inherited from existing deploy channel; not independently verified.'
          fi
          test -s "$known_hosts"
          echo "b1add7c825d8ab72c19fe417cb2489ad988a81d48b3b882915e65273f07a4860  scripts/nestlet-enable-sqlite.sh" | sha256sum --check --status
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o UserKnownHostsFile="$known_hosts" -p "$SSH_PORT" "$SSH_USER@$matched_address" \
            "if [ \"\$(id -u)\" = 0 ]; then exec bash -s -- $RELEASE_SHA; else exec sudo -n bash -s -- $RELEASE_SHA; fi" < scripts/nestlet-enable-sqlite.sh
