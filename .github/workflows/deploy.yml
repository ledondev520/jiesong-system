# Pinned same-schema10 guidance update. Never merge into Jiesong main.
# Activation requires final source/CI, independent review and release GO. Existing security files are reused.
name: Nestlet Same Schema10 Guidance Update
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed schema10 merge SHA; all other targets are rejected
        required: true
        type: string
      expected_host_sha256:
        description: SHA256 of the existing target IPv4 address
        required: true
        type: string
      host_key_sha256:
        description: Optional independently verified SSH public host-key fingerprint
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: nestlet-stage
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.repository == 'ledondev520/jiesong-system' && github.repository_owner == 'ledondev520' && github.ref == 'refs/heads/ops/nestlet-schema10-durable-prep-20261009' && github.actor == 'ledondev520'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Run bounded same-schema10 update
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_HOST_SHA256: ${{ inputs.expected_host_sha256 }}
          EXPECTED_HOST_FINGERPRINT: ${{ inputs.host_key_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          readonly REVIEWED_RELEASE_SHA=66725b9d98ecc50b4dadc3f2b224f312943403e8
          [[ "$REVIEWED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$RELEASE_SHA" = "$REVIEWED_RELEASE_SHA" ]] || { echo 'Release SHA does not match the reviewed schema10 merge'; exit 1; }
          test -n "$SSH_HOST" && test -n "$SSH_USER"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          if [[ -n "$EXPECTED_HOST_FINGERPRINT" ]]; then
            [[ "$EXPECTED_HOST_FINGERPRINT" =~ ^SHA256:[a-zA-Z0-9+/]{43}$ ]]
          fi
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_HOST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          matched_address=
          while IFS= read -r address; do
            observed="$(printf '%s' "$address" | sha256sum | awk '{print $1}')"
            if [[ "$observed" == "$EXPECTED_HOST_SHA256" ]]; then matched_address="$address"; fi
          done < <(getent ahostsv4 "$SSH_HOST" | awk '{print $1}' | sort -u)
          [[ -n "$matched_address" ]] || { echo 'Selected server address does not match the existing SSH target'; exit 1; }
          echo 'Existing SSH target matches selected server address; no address is logged.'
          echo "::add-mask::$matched_address"
          umask 077
          # No pin: inherit the already-authorized deploy channel's host-key discovery.
          # A supplied independent pin is mandatory to match; never bypass a mismatch.
          known_hosts="$(mktemp)"
          scanned="$(mktemp)"
          one="$(mktemp)"
          trap 'rm -f "$known_hosts" "$scanned" "$one"' EXIT
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$matched_address" > "$scanned" 2>/dev/null
          if [[ -n "$EXPECTED_HOST_FINGERPRINT" ]]; then
            while IFS= read -r host_key; do
              printf '%s\n' "$host_key" > "$one"
              observed="$(ssh-keygen -lf "$one" -E sha256 | awk '{print $2}')"
              if [[ "$observed" == "$EXPECTED_HOST_FINGERPRINT" ]]; then
                cat "$one" >> "$known_hosts"
              fi
            done < "$scanned"
          else
            cat "$scanned" > "$known_hosts"
            echo 'Host identity trust inherited from existing deploy channel; not independently verified.'
          fi
          test -s "$known_hosts"
          echo "2addb8e8ce80ba657f834e7ee7371b8229b39502503d8cb2e45e89c74154cab3  scripts/nestlet-update-schema10.sh" | sha256sum --check --status
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o UserKnownHostsFile="$known_hosts" -p "$SSH_PORT" "$SSH_USER@$matched_address" \
            "if [ \"\$(id -u)\" = 0 ]; then exec bash -s -- $RELEASE_SHA; else exec sudo -n bash -s -- $RELEASE_SHA; fi" < scripts/nestlet-update-schema10.sh
