# G-Stack Deploy
# 部署工作流 — 自动通过 SSH 部署到 VPS

name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20.19.0'

jobs:
  # 预部署检查
  pre-deploy:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint & TypeScript check
        working-directory: ./frontend
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Test frontend
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || '/api/v1' }}

  # 部署到 Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: pre-deploy
    if: github.event.inputs.environment == 'staging' || (github.ref == 'refs/heads/main' && github.event.inputs.environment == '') || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.jiesong-system.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Staging via SSH
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT || '22' }} '
            cd /opt/jiesong-system || exit 1
            git fetch origin
            git reset --hard origin/main
            cd backend
            npm ci --production
            npx prisma generate
            npx prisma migrate deploy
            cd ../frontend
            npm ci
            npm run build
            pm2 restart jiesong-backend || pm2 start ecosystem.config.js --only jiesong-backend
            pm2 restart jiesong-frontend || pm2 start ecosystem.config.js --only jiesong-frontend
            pm2 save
            sudo nginx -t && sudo systemctl reload nginx
          '

      - name: Notify Slack
        if: failure()
        run: |
          echo "Staging deploy failed"

  # 部署到 Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [pre-deploy, deploy-staging]
    if: github.event.inputs.environment == 'production' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc'))
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://jiesong-system.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Production via SSH
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT || '22' }} '
            cd /opt/jiesong-system || exit 1
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            cd backend
            npm ci --production
            npx prisma generate
            npx prisma migrate deploy
            cd ../frontend
            npm ci
            npm run build
            pm2 restart jiesong-backend || pm2 start ecosystem.config.js --only jiesong-backend
            pm2 restart jiesong-frontend || pm2 start ecosystem.config.js --only jiesong-frontend
            pm2 save
            sudo nginx -t && sudo systemctl reload nginx
          '

      - name: Notify deployment status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Deployment',
              description: 'Deployed to production',
            });
