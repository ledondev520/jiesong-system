# Dedicated Nestlet maintenance branch only; never merge this workflow into Jiesong main.
# No main push/PR trigger; dispatch only after independent review and owner approval.
# Uses existing staging-scoped SSH credentials for the same host as current main deployment.
name: Nestlet Schema5 Email Upgrade
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Upgrade the reviewed release, or send one fixed provider-only test
        required: true
        default: upgrade
        type: choice
        options:
          - upgrade
          - mail-proof
      release_sha:
        description: Approved upgrade commit; mail-proof requires the pinned running schema4 commit
        required: true
        type: string
      expected_host_sha256:
        description: SHA256 of the selected server IPv4 address; checked before SSH
        required: true
        type: string
      host_key_sha256:
        description: Optional independently verified VPS SSH public host-key fingerprint
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: nestlet-stage
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'ledondev520/jiesong-system' && github.repository_owner == 'ledondev520' && github.ref == 'refs/heads/ops/nestlet-schema5-email-release-20261007' && github.actor == 'ledondev520'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Run selected bounded Nestlet maintenance operation
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_HOST_SHA256: ${{ inputs.expected_host_sha256 }}
          EXPECTED_HOST_FINGERPRINT: ${{ inputs.host_key_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          if [[ -n "$EXPECTED_HOST_FINGERPRINT" ]]; then
            [[ "$EXPECTED_HOST_FINGERPRINT" =~ ^SHA256:[a-zA-Z0-9+/]{43}$ ]]
          fi
          [[ "$RELEASE_OPERATION" == upgrade || "$RELEASE_OPERATION" == mail-proof ]]
          if [[ "$RELEASE_OPERATION" == mail-proof ]]; then
            [[ "$RELEASE_SHA" == 4d4c15315d80b5fb7e9f8c2f3f883b10c1121c40 ]]
          fi
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_HOST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          matched_address=
          while IFS= read -r address; do
            observed="$(printf '%s' "$address" | sha256sum | awk '{print $1}')"
            if [[ "$observed" == "$EXPECTED_HOST_SHA256" ]]; then matched_address="$address"; fi
          done < <(getent ahostsv4 "$SSH_HOST" | awk '{print $1}' | sort -u)
          [[ -n "$matched_address" ]] || { echo 'Selected server address does not match the existing SSH target'; exit 1; }
          if [[ "$RELEASE_OPERATION" == upgrade ]]; then echo 'Existing SSH target matches selected server address; no address is logged.'; fi
          echo "::add-mask::$matched_address"
          umask 077
          # No pin: inherit the already-authorized deploy channel's host-key discovery.
          # A supplied independent pin is mandatory to match; never bypass a mismatch.
          known_hosts="$(mktemp)"
          scanned="$(mktemp)"
          one="$(mktemp)"
          proof_output="$(mktemp)"
          proof_errors="$(mktemp)"
          trap 'rm -f "$known_hosts" "$scanned" "$one" "$proof_output" "$proof_errors"' EXIT
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$matched_address" > "$scanned" 2>/dev/null
          if [[ -n "$EXPECTED_HOST_FINGERPRINT" ]]; then
            while IFS= read -r host_key; do
              printf '%s\n' "$host_key" > "$one"
              observed="$(ssh-keygen -lf "$one" -E sha256 | awk '{print $2}')"
              if [[ "$observed" == "$EXPECTED_HOST_FINGERPRINT" ]]; then
                cat "$one" >> "$known_hosts"
              fi
            done < "$scanned"
          else
            cat "$scanned" > "$known_hosts"
            if [[ "$RELEASE_OPERATION" == upgrade ]]; then echo 'Host identity trust inherited from existing deploy channel; not independently verified.'; fi
          fi
          test -s "$known_hosts"
          if [[ "$RELEASE_OPERATION" == mail-proof ]]; then
            echo "28878764d6bfbcd70ffeb1b091176a8eaf101c29f591d2779dccd1533a31fdcd  scripts/nestlet-mail-proof.py" | sha256sum --check --status
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
              -o UserKnownHostsFile="$known_hosts" -p "$SSH_PORT" "$SSH_USER@$matched_address" \
              'if [ "$(id -u)" = 0 ]; then exec python3 -; else exec sudo -n python3 -; fi' \
              < scripts/nestlet-mail-proof.py >"$proof_output" 2>"$proof_errors"; then
              if [[ "$(cat "$proof_output")" == provider-accepted ]]; then
                echo provider-accepted
                exit 0
              fi
            fi
            echo provider-unconfirmed
            exit 1
          fi
          echo "e6c071aefb8fc1100beb5e41d11830d1a4ff026bc700de3af9b7383db0e06a45  scripts/nestlet-upgrade-schema5.sh" | sha256sum --check --status
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o UserKnownHostsFile="$known_hosts" -p "$SSH_PORT" "$SSH_USER@$matched_address" \
            "if [ \"\$(id -u)\" = 0 ]; then exec bash -s -- $RELEASE_SHA; else exec sudo -n bash -s -- $RELEASE_SHA; fi" < scripts/nestlet-upgrade-schema5.sh
