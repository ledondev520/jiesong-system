# G-Stack Deploy
# 部署工作流 — 自动通过 SSH 部署到 VPS

name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20.19.0'

# 默认最小权限;需要写 commit status 的 job 单独声明
permissions:
  contents: read

jobs:
  # 预部署检查
  pre-deploy:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify deployment check behavior
        run: node --test scripts/verify-vps-runtime.test.cjs

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Prepare isolated frontend API fixture dependencies
        working-directory: ./backend
        run: |
          test ! -e .env
          test ! -L .env
          npm ci
          npm run db:generate

      - name: Lint & TypeScript check
        working-directory: ./frontend
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Test frontend
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || '/api/v1' }}

  # 部署到 Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: pre-deploy
    # Staging 必须部署到与生产隔离的目录和 pm2 进程(仓库变量 STAGING_DEPLOY_DIR、
    # STAGING_PM2_BACKEND、STAGING_PM2_FRONTEND)。未配置时跳过,push main 不会再触碰生产目录。
    if: >-
      vars.STAGING_DEPLOY_DIR != '' &&
      (github.event.inputs.environment == 'staging' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.jiesong-system.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Staging via SSH
        env:
          STAGING_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          STAGING_BACKEND: ${{ vars.STAGING_PM2_BACKEND }}
          STAGING_FRONTEND: ${{ vars.STAGING_PM2_FRONTEND }}
        run: |
          set -eu
          case "$STAGING_DIR" in
            ""|/opt/jiesong-system|/opt/jiesong-system/|/opt/jiesong_system/current|/opt/jiesong_system/current/)
              echo "Refusing: STAGING_DEPLOY_DIR must be isolated from production" >&2; exit 1 ;;
          esac
          if [ -z "$STAGING_BACKEND" ] || [ -z "$STAGING_FRONTEND" ] \
             || [ "$STAGING_BACKEND" = "jiesong-backend" ] || [ "$STAGING_FRONTEND" = "jiesong-frontend" ]; then
            echo "Refusing: staging pm2 names must be set and differ from production" >&2; exit 1
          fi
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT || '22' }} \
            "STAGING_DIR='$STAGING_DIR' STAGING_BACKEND='$STAGING_BACKEND' STAGING_FRONTEND='$STAGING_FRONTEND' SHA='${{ github.sha }}' STAGING_URL='${{ vars.STAGING_URL }}' bash -s" <<'REMOTE'
          set -eu
          cd "$STAGING_DIR" || exit 1
          PRICING_BACKUP=""
          if [ -f config/pricing.json ]; then
            PRICING_BACKUP="$(mktemp)"
            cp -p config/pricing.json "$PRICING_BACKUP"
            git checkout -- config/pricing.json 2>/dev/null || true
          fi
          git fetch origin
          git reset --hard "$SHA"
          if [ -n "$PRICING_BACKUP" ]; then
            cp -p "$PRICING_BACKUP" config/pricing.json
            rm -f "$PRICING_BACKUP"
            echo "Preserved runtime pricing config across deploy"
          fi
          cd backend
          npm ci --production
          npx prisma generate
          npx prisma migrate deploy
          cd ../frontend
          npm ci
          npm run build
          pm2 restart "$STAGING_BACKEND"
          pm2 restart "$STAGING_FRONTEND"
          pm2 save
          if [ -n "$STAGING_URL" ]; then
            node "$STAGING_DIR/scripts/verify-vps-runtime.cjs" "$STAGING_URL"
          fi
          REMOTE

      - name: Notify Slack
        if: failure()
        run: |
          echo "Staging deploy failed"

  # 部署到 Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # 生产只由 v* tag(非 rc)或手动选择 production 触发;不依赖 staging,避免手动选生产时被连带跳过
    needs: pre-deploy
    if: github.event.inputs.environment == 'production' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc'))
    permissions:
      contents: read
      statuses: write
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://jiesong-system.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Production via SSH
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT || '22' }} '
            set -eu
            cd /opt/jiesong-system || exit 1
            PRICING_BACKUP=""
            if [ -f config/pricing.json ]; then
              PRICING_BACKUP="$(mktemp)"
              cp -p config/pricing.json "$PRICING_BACKUP"
              git checkout -- config/pricing.json 2>/dev/null || true
            fi
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard ${{ github.sha }}
            if [ -n "$PRICING_BACKUP" ]; then
              cp -p "$PRICING_BACKUP" config/pricing.json
              rm -f "$PRICING_BACKUP"
              echo "Preserved runtime pricing config across deploy"
            fi
            cd backend
            npm ci --production
            npx prisma generate
            npx prisma migrate deploy
            cd ../frontend
            npm ci
            npm run build
            pm2 restart jiesong-backend || pm2 start ecosystem.config.js --only jiesong-backend
            pm2 restart jiesong-frontend || pm2 start ecosystem.config.js --only jiesong-frontend
            pm2 save
            sudo nginx -t && sudo systemctl reload nginx
            node /opt/jiesong-system/scripts/verify-vps-runtime.cjs "${{ vars.PRODUCTION_URL || 'https://jiesong-system.com' }}"
          '

      - name: Notify deployment status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Deployment',
              description: 'Deployed to production',
            });
