# Slack 通知工作流
name: Slack Notifications

on:
  workflow_run:
    workflows: ["CI", "QA & Health Check", "Deploy"]
    types: [completed]
  workflow_dispatch:

jobs:
  notify:
    name: Send Slack Notification
    runs-on: ubuntu-latest
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip when SLACK_WEBHOOK_URL is missing
        if: ${{ env.SLACK_WEBHOOK_URL == '' }}
        run: echo "SLACK_WEBHOOK_URL 未配置，跳过 Slack 通知。"

      - name: Notify CI Success
        if: ${{ env.SLACK_WEBHOOK_URL != '' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'CI' }}
        run: |
          bash .gstack/scripts/slack-notify.sh ci-success \
            "${{ github.ref_name }}" \
            "${{ github.sha }}" \
            "300"

      - name: Notify CI Failure
        if: ${{ env.SLACK_WEBHOOK_URL != '' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name == 'CI' }}
        run: |
          bash .gstack/scripts/slack-notify.sh ci-failure \
            "${{ github.ref_name }}" \
            "${{ github.sha }}" \
            "Check logs"

      - name: Notify QA Results
        if: ${{ env.SLACK_WEBHOOK_URL != '' && github.event.workflow_run.name == 'QA & Health Check' }}
        run: |
          bash .gstack/scripts/slack-notify.sh qa \
            "17" "13" "0" "4"

      - name: Notify Deploy
        if: ${{ env.SLACK_WEBHOOK_URL != '' && github.event.workflow_run.name == 'Deploy' }}
        run: |
          bash .gstack/scripts/slack-notify.sh deploy \
            "production" \
            "${{ github.ref_name }}" \
            "success"
