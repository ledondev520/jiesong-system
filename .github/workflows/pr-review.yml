# G-Stack PR Review
# PR 代码审查

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # 代码变更分析
  analyze:
    name: Analyze Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47

      - name: List changed files
        run: |
          echo "Changed files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

  # 类型安全检查
  type-safety:
    name: Type Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run type check
        working-directory: ./frontend
        run: npx tsc --noEmit

  # 代码风格检查
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Check code formatting
        working-directory: ./frontend
        run: npx prettier --check "src/**/*.{ts,tsx}"

  # PR 评论
  comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [type-safety, lint]
    if: always()
    steps:
      - uses: actions/checkout@v6

      - name: Comment PR
        uses: actions/github-script@v9
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## G-Stack PR Review')
            );

            const typeCheckStatus = '${{ needs.type-safety.result }}' === 'success' ? '✅' : '❌';
            const lintStatus = '${{ needs.lint.result }}' === 'success' ? '✅' : '❌';

            const body = `## G-Stack PR Review

            ### 检查结果
            - ${typeCheckStatus} TypeScript 类型检查
            - ${lintStatus} ESLint 代码风格

            ### 下一步
            - 所有检查通过后，可以进行代码审查
            - 合并前请确保 QA 测试通过

            ---
            *自动生成的 PR Review 报告*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
