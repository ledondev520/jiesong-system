# G-Stack PR Review
# PR 代码审查

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 新 push 取消同一 PR 的旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 代码变更分析
  analyze:
    name: Analyze Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6

      - name: List changed files
        run: |
          echo "Changed files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

  # 类型安全检查
  type-safety:
    name: Type Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-cached
        with:
          working-directory: frontend

      - name: Run type check
        working-directory: ./frontend
        run: npx tsc --noEmit

  # 代码风格检查
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-cached
        with:
          working-directory: frontend

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Test PR tooling
        working-directory: ./frontend
        run: node --test ../scripts/check-pr-format.test.cjs ../scripts/check-review-freshness.test.cjs ../scripts/check-ui-only.test.cjs ../scripts/check-build-typecheck-flag.test.cjs

      - name: Check changed source formatting
        working-directory: ./frontend
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run format:pr

  # 必过检查名别名 "Code Quality"：ESLint(lint) 与 tsc(type-safety) 已并行各跑一次，这里不重复运行。
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [type-safety, lint]
    if: always()
    permissions: {}
    steps:
      - name: Require lint and type jobs
        env:
          TYPE_CHECK_RESULT: ${{ needs.type-safety.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          echo "type=$TYPE_CHECK_RESULT lint=$LINT_RESULT"
          [ "$TYPE_CHECK_RESULT" = success ] && [ "$LINT_RESULT" = success ]

  # PR 检查结果摘要：不需要 GitHub 写权限，保留类型和 lint 的结果。
  comment:
    name: PR Review Summary
    runs-on: ubuntu-latest
    needs: [type-safety, lint]
    if: always()
    permissions: {}
    steps:
      - name: Publish review summary
        env:
          TYPE_CHECK_RESULT: ${{ needs.type-safety.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const icon = (result) => result === 'success' ? '✅' : '❌';
          const body = [
            '## G-Stack PR Review',
            '',
            `- ${icon(process.env.TYPE_CHECK_RESULT)} TypeScript 类型检查 (${process.env.TYPE_CHECK_RESULT})`,
            `- ${icon(process.env.LINT_RESULT)} ESLint 与格式检查 (${process.env.LINT_RESULT})`,
            '',
            '完整检查结果见本次 Actions 各 job；合并前需通过所有验收。',
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body);
          if (process.env.TYPE_CHECK_RESULT !== 'success' || process.env.LINT_RESULT !== 'success') process.exitCode = 1;
          NODE
