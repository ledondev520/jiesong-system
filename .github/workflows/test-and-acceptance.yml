name: Test And Acceptance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Run backend all tests (unit + db integration)
        run: npm run test:all
        working-directory: backend

  frontend-unit:
    name: Frontend Unit And Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend unit tests
        run: npm run test
        working-directory: frontend
      - name: Run frontend coverage
        run: npm run test:coverage
        working-directory: frontend

  frontend-e2e:
    name: Frontend E2E Acceptance
    runs-on: ubuntu-latest
    needs: [frontend-unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Playwright acceptance tests
        run: npm run test:e2e -- --reporter=list
        working-directory: frontend
        timeout-minutes: 25
      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Upload test logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
