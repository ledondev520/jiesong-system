name: Test And Acceptance

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# 新 push 取消同一 PR 的旧运行；非 PR 事件用唯一 run_id，永不取消（main push 保持各自完整运行）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # npm 缓存 key 只含本 job 实际安装的锁文件，否则先保存的 job 会留下缺包缓存。
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      # 变更门禁：只有整个 diff 都在 UI-only 清单内才为 false；push、历史缺失或任何错误一律 true（照常全测）。
      - name: Change gate
        id: gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-ui-only.cjs backend-gate
      # 依赖始终安装：生命周期合同检查扫描前端列表页，需要后端 acorn。
      - name: Install backend dependencies
        uses: ./.github/actions/npm-ci-cached
        with:
          working-directory: backend
      - name: Run backend all tests (unit + db integration)
        if: steps.gate.outputs.backend_changed != 'false'
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run test:all
        working-directory: backend
        env:
          DATABASE_URL: file:./dev.db
      - name: UI-only change - lifecycle contract only
        if: steps.gate.outputs.backend_changed == 'false'
        run: node scripts/check-lifecycle.cjs

  # BL-8: 4 片并行跑测试（保持文件隔离），再合并 blob 报告并在合并结果上执行覆盖率门禁。
  frontend-unit-shard:
    name: Frontend Unit Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install frontend dependencies
        uses: ./.github/actions/npm-ci-cached
        with:
          working-directory: frontend
      - name: Install isolated frontend API fixture dependencies
        uses: ./.github/actions/npm-ci-cached
        with:
          working-directory: backend
      # generate 每次都跑：Prisma client 不依赖缓存命中。
      - name: Prepare isolated frontend API fixture
        working-directory: backend
        run: |
          test ! -e .env
          test ! -L .env
          npm run db:generate
      # 单片覆盖率不完整，阈值只在合并后的 frontend-unit 判定（此处置 0 避免误报）。
      - name: Run frontend unit shard
        working-directory: frontend
        run: >
          npx vitest run --coverage --reporter=default --reporter=blob --shard=${{ matrix.shard }}
          --coverage.reporter=text-summary
          --coverage.thresholds.statements=0 --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0
      - name: Upload shard report
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ strategy.job-index }}
          path: frontend/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # 必过检查名保持 Frontend Unit And Coverage：任一分片失败/取消则本 job 失败（skipped 会被 ruleset 当作通过，故 always()）。
  frontend-unit:
    name: Frontend Unit And Coverage
    runs-on: ubuntu-latest
    needs: [frontend-unit-shard]
    if: always()
    steps:
      - name: Require all unit shards
        env:
          SHARDS_RESULT: ${{ needs.frontend-unit-shard.result }}
        run: |
          echo "shards=$SHARDS_RESULT"
          [ "$SHARDS_RESULT" = success ]
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        uses: ./.github/actions/npm-ci-cached
        with:
          working-directory: frontend
      - name: Download shard reports
        uses: actions/download-artifact@v7
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: frontend/.vitest-reports
      # 合并各片结果与覆盖率，覆盖率阈值（vitest.config.ts）在合并结果上执行。
      - name: Merge reports and enforce coverage thresholds
        run: npx vitest --merge-reports --coverage
        working-directory: frontend
      - name: Upload coverage report
        if: ${{ !cancelled() && needs.frontend-unit-shard.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 7

  # 必过检查名别名：不重复跑测试，仅在后端与前端单测都成功时通过。
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]
    if: always()
    permissions: {}
    steps:
      - name: Require unit test jobs
        env:
          BACKEND_RESULT: ${{ needs.backend-unit.result }}
          FRONTEND_RESULT: ${{ needs.frontend-unit.result }}
        run: |
          echo "backend=$BACKEND_RESULT frontend=$FRONTEND_RESULT"
          [ "$BACKEND_RESULT" = success ] && [ "$FRONTEND_RESULT" = success ]

  e2e-shard:
    name: E2E Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install frontend dependencies
        uses: ./.github/actions/npm-ci-cached
        with:
          working-directory: frontend
      - name: Install isolated recovery backend fixture
        uses: ./.github/actions/npm-ci-cached
        with:
          working-directory: backend
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      # 浏览器命中缓存时仍需系统依赖。
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend
      - name: Run Playwright acceptance tests (shard ${{ matrix.shard }})
        # 按权重分文件（--shard 按文件数切分会失衡）；无 --shard 时 blob 文件同名，故按序号命名以便 merge-multiple。
        env:
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ strategy.job-index }}.zip
          # 仅 E2E webServer 构建跳过 Next 的类型检查（Type Safety Check / Build Test 仍为必过）；禁止出现在部署流程，见 scripts/check-build-typecheck-flag.test.cjs。
          E2E_SKIP_BUILD_TYPECHECK: '1'
        run: |
          node --test ../scripts/e2e-shard-files.test.cjs
          npm run test:e2e -- --reporter=list,blob $(node ../scripts/e2e-shard-files.cjs "${SHARD%/*}" "${SHARD#*/}")
        working-directory: frontend
        timeout-minutes: 25
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ strategy.job-index }}
          path: frontend/blob-report/
          retention-days: 7
      - name: Upload test logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ strategy.job-index }}
          path: frontend/test-results/
          retention-days: 7

  # 必过检查名汇总：全部分片成功才通过；失败时合并分片报告。
  frontend-e2e:
    name: Frontend E2E Acceptance
    runs-on: ubuntu-latest
    needs: [e2e-shard]
    if: always()
    steps:
      - name: Require all shards
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "shards=$SHARDS_RESULT"
          [ "$SHARDS_RESULT" = success ]
      - name: Download blob reports
        if: ${{ failure() && needs.e2e-shard.result == 'failure' }}
        uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge shard reports
        if: ${{ failure() && needs.e2e-shard.result == 'failure' }}
        run: npx --yes playwright@1.64.1 merge-reports --reporter html ./all-blob-reports
      - name: Upload merged Playwright report
        if: ${{ failure() && needs.e2e-shard.result == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
