name: Test And Acceptance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      # 变更门禁：只有整个 diff 都在 UI-only 清单内才为 false；push、历史缺失或任何错误一律 true（照常全测）。
      - name: Change gate
        id: gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-ui-only.cjs backend-gate
      # 依赖始终安装：生命周期合同检查扫描前端列表页，需要后端 acorn。
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Run backend all tests (unit + db integration)
        if: steps.gate.outputs.backend_changed != 'false'
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run test:all
        working-directory: backend
        env:
          DATABASE_URL: file:./dev.db
      - name: UI-only change - lifecycle contract only
        if: steps.gate.outputs.backend_changed == 'false'
        run: node scripts/check-lifecycle.cjs

  frontend-unit:
    name: Frontend Unit And Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Prepare isolated frontend API fixture dependencies
        working-directory: backend
        run: |
          test ! -e .env
          test ! -L .env
          npm ci
          npm run db:generate
      - name: Run frontend unit tests
        run: npm run test
        working-directory: frontend
      - name: Run frontend coverage
        run: npm run test:coverage
        working-directory: frontend

  frontend-e2e:
    name: Frontend E2E Acceptance
    runs-on: ubuntu-latest
    needs: [frontend-unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install isolated recovery backend fixture
        run: |
          npm ci
          npx prisma generate
        working-directory: backend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Playwright acceptance tests
        run: npm run test:e2e -- --reporter=list
        working-directory: frontend
        timeout-minutes: 25
      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Upload test logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
